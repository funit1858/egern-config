# =====================================================
# Quantumult X 简洁配置 · 伴学课堂解锁版 v3
# 语法已对照 QX 官方规范 + 墨鱼成熟配置逐项核验
# 用法：
#   1. [server_remote] 填入你的机场订阅链接（可选，解锁不依赖）
#   2. 设置 → MitM → 生成证书 → 安装并信任
#   3. 打开 QX → 重新登录伴学课堂
# =====================================================

[general]

server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 3000
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
excluded_routes = 239.255.255.250/32

# =====================================================
[server_remote]

# 填入你的机场订阅（删除 # 号）：
# https://你的订阅地址/sub, tag=机场, enabled=true

# =====================================================
[policy]

static=Proxy, 自动选择, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
url-latency-benchmark=自动选择, server-tag-regex=.*, check-interval=1800, tolerance=0, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
static=兜底, Proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# =====================================================
[filter_remote]

# 广告拦截（域名拒绝优先）
https://raw.githubusercontent.com/Cats-Team/AdRules/main/qx.conf, tag=广告拦截, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true
# 国内直连
https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list, tag=国内网站, force-policy=direct, update-interval=604800, opt-parser=true, enabled=true
# 苹果服务
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=苹果服务, force-policy=direct, update-interval=604800, opt-parser=true, enabled=true

# =====================================================
[filter_local]

# 本地网段直连
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
geoip, cn, direct

# 伴学课堂直连
host-suffix, banxueketang.com, direct

# 兜底：国外走代理
final, 兜底

# =====================================================
[rewrite_local]

# ===== 伴学课堂 VIP 解锁 =====
^https?:\/\/api\.banxueketang\.com\/api\/classpal\/app\/v1 url script-response-body https://raw.githubusercontent.com/funit1858/egern-config/main/scripts/banxueketang.vip.js

# =====================================================
[dns]

server = 223.5.5.5, 119.29.29.29, 8.8.8.8
no-system

# =====================================================
[mitm]

hostname = api.banxueketang.com
