name: 财新解锁
description: 财新 App 会员/正文解锁。articlev5 注入 JS 取全文 + newValidate 伪装成功(消除前端 checkAuth 报错提示)。仅供学习交流。
author: funit1858
homepage: https://github.com/funit1858/egern-config

url_rewrites:
  - match: "^https://file\\.caixin\\.cn/"
    location: "https://file.caixin.com/"
    status_code: 307

map_locals:
  - match: "^https://gateway\\.caixin\\.com/api/app-api/auth/newValidate$"
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"code":0,"data":{"info":{"power":1,"errorCode":0,"tipsMsg":"","redmsg":""}}}'

body_rewrites:
  - response_regex:
      match: mappsv5\.caixin\.com/articlev5
      find: '<title>'
      replace: '<title>[UNLOCKED] '

scriptings:
  - http_response:
      name: 财新解锁
      match: mappsv5\.caixin\.com/articlev5
      script_url: https://raw.githubusercontent.com/funit1858/egern-config/main/scripts/caixin.egern.js
      body_required: true
      update_interval: 60
      timeout: 10

mitm:
  hostnames:
    - mappsv5.caixin.com
    - gateway.caixin.com
    - file.caixin.cn

http_captures:
  - mappsv5.caixin.com
  - gateway.caixin.com
  - file.caixin.cn
