name: 财新解锁
description: 财新 App 会员/正文解锁。articlev5 页面注入 JS 调用明文 checkUserAndLoginRead 接口获取全文。仅 MITM mappsv5.caixin.com，不干扰 gateway 原生 API（统计上报等）。仅供学习交流。
author: funit1858
homepage: https://github.com/funit1858/egern-config

body_rewrites:
  - response_regex:
      match: mappsv5\.caixin\.com/articlev5
      find: '<title>'
      replace: '<title>[UNLOCKED] '

scriptings:
  - http_response:
      name: 财新解锁
      match: mappsv5\.caixin\.com/articlev5
      script_url: https://raw.githubusercontent.com/funit1858/egern-config/main/scripts/caixin.egern.js
      body_required: true
      update_interval: 60
      timeout: 10

mitm:
  hostnames:
    - mappsv5.caixin.com

http_captures:
  - mappsv5.caixin.com
