name: 财新解锁
description: 财新 App 会员/正文解锁。articlev5 注入 JS 调 checkUserAndLoginRead 取全文；file.caixin.cn 直连避免资源加载失败。仅供学习交流。
author: funit1858
homepage: https://github.com/funit1858/egern-config

rules:
  - domain_suffix:
      match: file.caixin.cn
      policy: DIRECT

body_rewrites:
  - response_regex:
      match: mappsv5\.caixin\.com/articlev5
      find: '<title>'
      replace: '<title>[UNLOCKED] '

scriptings:
  - http_response:
      name: 财新解锁
      match: mappsv5\.caixin\.com/articlev5
      script_url: https://raw.githubusercontent.com/funit1858/egern-config/main/scripts/caixin.egern.js
      body_required: true
      update_interval: 60
      timeout: 10

mitm:
  hostnames:
    - mappsv5.caixin.com

http_captures:
  - mappsv5.caixin.com
