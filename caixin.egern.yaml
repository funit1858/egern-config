name: 财新解锁
description: 财新 App 会员/正文解锁。newValidate 返回 data.info.power，power>0 展开全文；articlev5 HTML 中 isFree/need_login 翻转。只改响应不改请求。仅供学习交流。
author: funit1858
homepage: https://github.com/funit1858/egern-config

body_rewrites:
  - match: (gateway|mappsv5|mapiv5)\.caixin\.com
    find: '<title>'
    replace: '<title>[UNLOCKED] '
    type: response
  - match: gateway\.caixin\.com
    find: '"power":0'
    replace: '"power":1'
    type: response
  - match: gateway\.caixin\.com
    find: '"errorCode":7'
    replace: '"errorCode":0'
    type: response
  - match: mappsv5\.caixin\.com
    find: '"isFree":1'
    replace: '"isFree":0'
    type: response
  - match: mappsv5\.caixin\.com
    find: '"need_login":1'
    replace: '"need_login":0'
    type: response

scriptings:
  - http_response:
      name: 财新解锁
      match: (gateway|mappsv5|mapiv5)\.caixin\.com
      script_url: https://raw.githubusercontent.com/funit1858/egern-config/main/scripts/caixin.egern.js
      body_required: true
      update_interval: 60
      timeout: 10

mitm:
  hostnames:
    - gateway.caixin.com
    - mapiv5.caixin.com
    - mappsv5.caixin.com

http_captures:
  - gateway.caixin.com
  - mapiv5.caixin.com
  - mappsv5.caixin.com
