#!name=财新解锁
#!desc=财新 App 会员/正文解锁（响应改写）。正文权限 newValidate 返回 data.info.power，power>0 展开全文。只改响应不改请求。仅供学习交流。
#!author=funit1858
#!updateTime=2026-08-14

scriptings:
  - http_response:
      name: 财新解锁
      match: (gateway|mappsv5|mapiv5)\.caixin\.com
      script_url: https://cdn.jsdelivr.net/gh/funit1858/egern-config@main/scripts/caixin.egern.js
      body_required: true
      update_interval: 60
      timeout: 10

mitm:
  hostnames:
    includes:
      - gateway.caixin.com
      - mapiv5.caixin.com
      - mappsv5.caixin.com

http_captures:
  - gateway.caixin.com
  - mapiv5.caixin.com
  - mappsv5.caixin.com
